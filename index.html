<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avivamento</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="index.css">
<style>
body{margin:0;background:#000}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.video{height:100vh;scroll-snap-align:start;position:relative;background:#111;width:100vw;overflow:hidden}
.video iframe{width:100%;height:100%;border:0;position:absolute;inset:0}
.skeleton{height:100vh;scroll-snap-align:start;position:relative;background:#111;width:100vw;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-sizing:border-box;gap:12px}
.skeleton::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#111 20%,#222 40%,#111 60%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton.linha{height:14px;background:#222;border-radius:8px;position:relative;z-index:1}
.skeleton.linha.t1{width:40%}
.skeleton.linha.t2{width:70%}
.skeleton.linha.t3{width:55%}
.loader-video{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#000}
.spinner{width:45px;height:45px;border:3px solid rgba(255,255,255,.2);border-top:3px solid #ff0000;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom{position:absolute;bottom:110px;left:14px;right:14px;z-index:2;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;background:rgba(0,0,0,.4);padding:8px;border-radius:8px}
.fim{height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px}
.fim button{padding:10px 20px;border-radius:20px;border:0;background:#ff0000;color:#fff;font-weight:bold}
</style>
</head>
<body>

<div id="feed">
  <div class="skeleton"><div class="linha t1"></div><div class="linha t2"></div><div class="linha t3"></div></div>
  <div class="skeleton"><div class="linha t1"></div><div class="linha t2"></div><div class="linha t3"></div></div>
  <div class="skeleton"><div class="linha t1"></div><div class="linha t2"></div><div class="linha t3"></div></div>
</div>

<div class="nav">
  <div class="nav-item active"><i class="bi bi-house-door-fill"></i><span>Início</span></div>
  <div class="nav-item" onclick="location.href='video.html'"><i class="bi bi-play-btn-fill"></i><span>Vídeos</span></div>
  <div class="nav-item" onclick="location.href='kids.html'"><i class="bi bi-puzzle-fill"></i><span>Kids</span></div>
  <div class="nav-item" onclick="location.href='cultos.html'"><i class="bi bi-calendar-heart-fill"></i><span>Cultos</span></div>
  <div class="nav-item" onclick="location.href='quiz.html'"><i class="bi bi-trophy-fill"></i><span>Quiz</span></div>
</div>

<script>
const SHEET_URL = `https://docs.google.com/spreadsheets/d/1F4i76rq3FNa6QSaKVTBzXekw5d6H522i-TIU_nn-H0c/gviz/tq?tqx=out:csv`;

function getID(url){ let m=(url||'').match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }
function getAssistidos(){ return JSON.parse(localStorage.getItem('assistidos_v2') || '[]'); }
function salvarAssistido(id){ let l=getAssistidos(); if(!l.includes(id)){ l.push(id); localStorage.setItem('assistidos_v2', JSON.stringify(l)); } }
function resetarTudo(){ localStorage.removeItem('assistidos_v2'); location.reload(); }
function comando(iframe, func){ try{ iframe.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:''}), '*'); }catch(e){} }

let ordem = [];
let carregados = 0;
const LOTE = 3;
let observerPlay;
let atual = -1;

function criarObserverPlay(){
  if(observerPlay) observerPlay.disconnect();
  observerPlay = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const idx = parseInt(entry.target.dataset.index);
        if(idx === atual) return;
        atual = idx;
        document.querySelectorAll('.video iframe').forEach((ifr, j)=>{ if(j!== idx) comando(ifr, 'pauseVideo'); });
        const atualIframe = document.getElementById(`iframe-${idx}`);
        if(atualIframe){ salvarAssistido(ordem[idx].ytId); setTimeout(()=> comando(atualIframe, 'playVideo'), 300); }

        // QUANDO CHEGA NO PENÚLTIMO CARREGA MAIS 3
        if(idx >= carregados - 2){
          carregarLote();
        }
      }
    });
  }, {threshold: 0.75});
  document.querySelectorAll('.video').forEach(v=> observerPlay.observe(v));
}

function criarHTMLVideo(v,i){
  return `
    <div class="video" data-index="${i}" id="video-${i}">
      <div class="loader-video" id="loader-${i}"><div class="spinner"></div></div>
      <iframe id="iframe-${i}" onload="document.getElementById('loader-${i}').style.display='none'"
        src="https://www.youtube.com/embed/${v.ytId}?enablejsapi=1&controls=1&rel=0&modestbranding=1&playsinline=1&mute=0&loop=1&playlist=${v.ytId}"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
      </iframe>
      <div class="bottom">
        <div>${v.cantor||''}</div>
        <b>${v.titulo||''}</b>
      </div>
    </div>`;
}

function carregarLote(){
  const feed = document.getElementById('feed');
  // remove o fim se existir
  const fimExistente = document.getElementById('fim-avivamento');
  if(fimExistente) fimExistente.remove();

  const proximoFim = Math.min(carregados + LOTE, ordem.length);
  for(let i = carregados; i < proximoFim; i++){
    feed.insertAdjacentHTML('beforeend', criarHTMLVideo(ordem[i], i));
  }
  carregados = proximoFim;

  // se acabou, coloca o fim
  if(carregados >= ordem.length){
    feed.insertAdjacentHTML('beforeend', `<div class="fim" id="fim-avivamento"><h2>Fim por hoje!</h2><button onclick="resetarTudo()">Ver de novo</button></div>`);
  }
  criarObserverPlay();
}

async function carregar(){
  const res = await fetch(SHEET_URL);
  const csv = await res.text();
  const linhas = csv.split('\n').slice(1);
  let videos = [];
  linhas.forEach(linha=>{
    if(!linha.trim()) return;
    const cols = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());
    const [link, titulo, cantor] = cols;
    const ytId = getID(link);
    if(!ytId) return;
    videos.push({ytId, titulo, cantor});
  });
  videos = [...new Map(videos.map(v=>[v.ytId, v])).values()];
  const assistidos = getAssistidos();
  let naoVistos = videos.filter(v =>!assistidos.includes(v.ytId));
  if(naoVistos.length===0 && videos.length>0){
    document.getElementById('feed').innerHTML = `<div class="fim"><h2>Você viu tudo!</h2><button onclick="resetarTudo()">Ver de novo</button></div>`;
    return;
  }
  ordem = embaralhar(naoVistos);
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  carregados = 0;
  carregarLote(); // carrega só os 3 primeiros
}
carregar();
</script>
</body>
</html>
